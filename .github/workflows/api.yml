# Backend: tiplar, hisob-kitob testlari va to'liq e2e oqim (Postgres + Redis bilan)
name: api

on:
  push:
    paths: ['apps/api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['apps/api/**', '.github/workflows/api.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taomdosh
          POSTGRES_PASSWORD: taomdosh
          POSTGRES_DB: taomdosh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taomdosh" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://taomdosh:taomdosh@localhost:5432/taomdosh
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      AUTH_TEST_PHONES: '*'
      AUTH_TEST_CODE: '111111'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e
      - run: npm run build
